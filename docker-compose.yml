name: memecoin-shadow

services:
  desk:
    build: .
    command: ["python", "-m", "src.main", "--dry-run"]
    restart: unless-stopped
    environment:
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      ALCHEMY_KEY: ${ALCHEMY_KEY:-}
      YELLOWSTONE_GRPC_URL: ${YELLOWSTONE_GRPC_URL:-}
      YELLOWSTONE_GRPC_TOKEN: ${YELLOWSTONE_GRPC_TOKEN:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: INFO
      HEALTH_PORT: 8080
      ALLOW_LIVE_TRADING: ""
    ports:
      - "127.0.0.1:${MEMECOIN_SHADOW_PORT:-18080}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 3.5G
        reservations:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
