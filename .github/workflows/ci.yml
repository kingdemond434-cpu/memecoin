name: ci

# Runs on every push and pull request so a red suite is visible on the commit
# rather than discovered on the node. The branch reported zero checks before
# this existed, which meant "tests pass" was a claim with nothing behind it.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked Windows stable-ABI wheel
        run: |
          python -m pip install "maturin>=1.7,<2"
          python -m maturin build --release --locked --manifest-path native/solana_fastpath/Cargo.toml --out native-wheels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Verify wheel on VPS Python version
        env:
          ALLOW_LIVE_TRADING: ""
          SOLANA_PRIVATE_KEY: ""
        run: |
          python -m pip install -r requirements-dev.txt
          $wheel = Get-ChildItem native-wheels/*.whl
          if ($wheel.Count -ne 1) { throw 'Expected one native wheel' }
          python -m pip install --no-deps $wheel.FullName
          python -c "import solana_fastpath; print(solana_fastpath.IMPLEMENTATION)"
          python -m pytest tests -q --durations=15 -o faulthandler_timeout=60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/bench_hotpath.py --json native-wheels/benchmark.json
      - name: Retain wheel provenance
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $wheel = Get-ChildItem native-wheels/*.whl
          @{commit=$env:GITHUB_SHA; source_head=$env:SOURCE_HEAD; tree=(git rev-parse 'HEAD^{tree}'); sha256=(Get-FileHash $wheel.FullName -Algorithm SHA256).Hash; wheel=$wheel.Name; tested_python='3.14'; live_submission='LOCKED'} | ConvertTo-Json | Set-Content native-wheels/build-receipt.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.sha }}
          path: native-wheels/
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit pack reads the repository's own history, so a shallow
          # checkout makes it report DATA_BLOCKED and fails a test that is
          # correct. Full history here is not a workaround: it is the state
          # the pack is built against on a real node.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build the native extension
        # Built here so the Rust/Python parity tests actually RUN. They skip
        # when the extension is absent -- correctly, since the Python path is
        # the reference implementation and must work without Rust -- but a
        # parity test that always skips is a parity test that proves nothing.
        run: |
          cargo build --release --manifest-path native/solana_fastpath/Cargo.toml
          mkdir -p native-ext
          cp native/solana_fastpath/target/release/libsolana_fastpath.so \
             native-ext/solana_fastpath.so
          echo "PYTHONPATH=$PWD/native-ext" >> "$GITHUB_ENV"

      - name: Assert the parity tests are not silently skipping
        run: |
          python - <<'PY'
          import solana_fastpath
          print("native extension importable:", solana_fastpath.IMPLEMENTATION)
          PY
      - name: Run the suite
        # The live-capital acknowledgement is explicitly cleared rather than
        # merely absent, so a runner that inherited it from somewhere cannot
        # let a test take a path that only exists when trading is unlocked.
        env:
          ALLOW_LIVE_TRADING: ""
          SOLANA_PRIVATE_KEY: ""
        run: python -m pytest tests -q --durations=20 -o faulthandler_timeout=60

      - name: Latency regression check
        # A correctness regression fails the build and a latency regression
        # did not, which left the one property this system is supposed to have
        # as the one nothing defended.
        #
        # The tolerance is four times baseline, which sounds absurd until you
        # remember these are shared runners that vary by a factor of two on
        # identical code. It catches the class worth failing a build over: an
        # accidental quadratic, a lost cache, or the Rust path silently
        # falling back to Python. Anything subtler is measured on the node,
        # where the number means something.
        run: python tools/bench_hotpath.py

      - name: Assert the vendored IDL tables are current
        # The Rust account-flag tables are generated from the IDLs. A hand
        # edit that drifts from them builds transactions the program rejects,
        # so drift fails here rather than on chain.
        run: python tools/gen_account_flags.py --check

      - name: Smoke test the desk
        env:
          ALLOW_LIVE_TRADING: ""
          SOLANA_PRIVATE_KEY: ""
        run: python -m src.main --dry-run --smoke-test > readiness.json

      - name: Assert the safety state
        # A green suite with an unlocked live path is not a passing build.
        run: |
          python - <<'PY'
          import json, sys
          raw = open("readiness.json").read()
          data = json.loads(raw[raw.index("{"):])
          problems = []
          if data.get("mode") != "DRY_RUN":
              problems.append(f"mode is {data.get('mode')}")
          if not data.get("live_submission_locked"):
              problems.append("live submission is not locked")
          if not (data.get("execution") or {}).get("dry_run"):
              problems.append("execution is not in dry run")
          if problems:
              sys.exit("SAFETY STATE FAILED: " + "; ".join(problems))
          print("safety state OK: DRY_RUN, live_submission_locked")
          PY

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/solana_fastpath
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test without linking Python
        # `extension-module` tells pyo3 not to link libpython, which is right
        # for a wheel and fatal for a test binary. The logic lives behind the
        # feature gate precisely so it can be tested on its own.
        run: cargo test --no-default-features
      - name: Clippy
        run: cargo clippy --no-default-features -- -D warnings
      - name: Build the extension
        run: cargo build --release
