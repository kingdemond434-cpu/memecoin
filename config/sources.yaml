  - id: rss:vn-local
    kind: rss
    tier: 3
    language: vi
    region: sea
    poll_interval_seconds: 1800
  - id: rss:th-local
    kind: rss
    tier: 3
    language: th
    region: sea
    poll_interval_seconds: 1800
  - id: rss:ph-local
    kind: rss
    tier: 3
    language: tl
    region: sea
    poll_interval_seconds: 1800
  - id: rss:ng-local
    kind: rss
    tier: 3
    language: en
    region: africa
    poll_interval_seconds: 1800
  - id: rss:latam-local
    kind: rss
    tier: 3
    language: es
    region: latam
    poll_interval_seconds: 900
  - id: rss:it-local
    kind: rss
    tier: 3
    language: it
    region: eu
    poll_interval_seconds: 1800
  - id: rss:pl-local
    kind: rss
    tier: 3
    language: pl
