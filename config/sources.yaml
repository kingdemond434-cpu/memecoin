# The source universe, declared rather than coded.
#
# Adding the 47th Korean regional outlet is an edit here, not a pull request.
# `requires_env` names the environment variable holding a credential; the
# registry checks PRESENCE only and never reads or logs a value. A declaration
# whose credential is absent is reported UNCONFIGURED rather than silently
# dropped, because a source that vanishes for a missing key is a coverage hole
# nobody sees.
#
# `tier` is intended lead value, not trust: 1 = expected to lead, 3 = context.
# It orders polling effort. What a source is actually worth is measured by
# src/strategies/source_genealogy.py from observed lead time and executable
# return, and that measurement overrides this number.
#
# `poll_interval_seconds` is how often this source is worth ASKING, which is a
# different number from how long its silence means something. A regional daily
# polled every second is four thousand pointless requests an hour and an
# eventual block; a chat channel polled hourly is a channel we are not reading.
#
# Every endpoint named here is a documented public interface requiring no
# account. Entries with NO endpoint are coverage targets, reported by name as
# pending -- never a placeholder URL, because a declaration naming an endpoint
# nobody checked is worse than no declaration at all: the mesh reports it DEAD,
# an operator assumes it needs a key, and the coverage number stays wrong in
# the flattering direction.
#
# Verify on the node before trusting any of it:
#   python tools/verify_sources.py --out config/sources.verified.yaml

schema_version: v1

sources:
  # ---- chain-adjacent and highest tier -------------------------------------
  - id: metadata:pump-ipfs
    kind: metadata
    tier: 1
    region: global
  - id: code:pump-public-docs
    kind: code_repo
    tier: 2
    region: global
    options: {repo: pump-fun/pump-public-docs}

  # ---- Telegram: crypto-native, where a CA usually appears first -----------
  # These declare which LANGUAGES are worth covering, not which channels. A
  # placeholder channel name would read as a chosen channel and report
  # UNCONFIGURED, which an operator reads as "needs a key" rather than as
  # "nobody has picked one". Add `options: {channel: <public channel>}` per
  # entry; until then each is reported as pending an endpoint, by name.
  #
  # These are the MTProto path: lowest latency, needs an authorised session.
  # They are no longer the only Telegram coverage. src/research/telegram_miners
  # reads public t.me/s/<channel> previews with no account at all, discovers
  # handles from t.me links the desk already mines, and verifies each one by
  # fetching its own preview before reading it. That path needs no
  # configuration and fills itself; these entries are worth naming when you
  # want a specific channel at MTProto speed rather than preview speed.
  - id: telegram:calls-en-1
    kind: telegram
    tier: 1
    degraded_after_seconds: 60
    dead_after_seconds: 300
    language: en
    region: global
    requires_env: [TELEGRAM_API_ID, TELEGRAM_API_HASH]
  - id: telegram:calls-zh-1
    kind: telegram
    tier: 1
    language: zh
    region: cn
    requires_env: [TELEGRAM_API_ID, TELEGRAM_API_HASH]
  - id: telegram:calls-ru-1
    kind: telegram
    tier: 1
    language: ru
    region: cis
    requires_env: [TELEGRAM_API_ID, TELEGRAM_API_HASH]
  - id: telegram:calls-tr-1
    kind: telegram
    tier: 1
    language: tr
    region: tr
    requires_env: [TELEGRAM_API_ID, TELEGRAM_API_HASH]
  - id: telegram:calls-ko-1
    kind: telegram
    tier: 1
    language: ko
    region: kr
    requires_env: [TELEGRAM_API_ID, TELEGRAM_API_HASH]

  # ---- open social firehoses: free, filtered locally -----------------------
  - id: bluesky:jetstream
    kind: bluesky
    tier: 2
    language: en
    region: global
