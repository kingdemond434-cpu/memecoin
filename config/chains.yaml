global:
  enabled_chains: ["solana"]
  max_concurrent_positions: 10
  max_position_size_usd: 500
  max_daily_loss_usd: 1000
  min_profit_target_pct: 50
  max_hold_time_minutes: 60
  stop_loss_pct: 30
  trailing_stop_pct: 15
  gas_multiplier: 1.5
  priority_fee_gwei: 2
  mev_protection: true
  flashbots_relay: "https://relay.flashbots.net"
  jito_tip_lamports: 100000
  log_level: "INFO"
  dry_run: true
  paper_equity_usd: 10000
  max_total_exposure_pct: 0.30
  # Broad shadow portfolio: many small independent trials capture rare tails
  # without changing the separately gated live-capital policy above.
  shadow_max_concurrent_positions: 100
  shadow_max_position_pct: 0.01
  shadow_max_position_size_usd: 100
  shadow_max_total_exposure_pct: 0.50
  shadow_max_portfolio_risk: 0.10
  max_liquidity_fraction: 0.01
  min_liquidity_usd: 5000
  reject_data_blocked_safety_checks: true
  max_candidate_concurrency: 24
  max_candidate_pipelines: 500
  candidate_recheck_delays_seconds: [0, 1, 3, 5, 10]
  market_observation_budget: 1
  market_observation_cohort_size: 100
  market_observer_sleep_seconds: 0.25
  market_probe_lamports: 10000000
