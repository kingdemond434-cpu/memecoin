# Public figures, projects and brands whose names get minted.
#
# This registry exists to answer one question: when a token's metadata claims
# a famous name, is the claim confirmed by that name's own public channel, or
# is it one of the very many that are not? Both outcomes are tradeable and
# they are opposite trades, so the desk must never collapse them.
#
# Nothing here asserts anything about the people named. An entry means "this
# name shows up in launch metadata and we want to detect it", which is a
# statement about the market, not about the person.
#
# FIELDS
#   key             stable identifier, never displayed
#   display         the name as it is usually written
#   category        politician | celebrity | influencer | founder | athlete
#                   | project | exchange | brand | event
#   aliases         other spellings, surnames alone, common tickers. Terms
#                   under three characters are ignored by the matcher: a
#                   two-letter alias matches half the market.
#   channels        handles the figure PUBLISHES AS THEIR OWN, copied from
#                   their own verified profile. This field is what makes
#                   corroboration possible, and it is deliberately EMPTY here.
#                   A handle nobody can point at a self-published source for
#                   would turn a stranger's channel into an oracle for that
#                   person's intentions, which is worse than having no oracle.
#                   Fill these in from the figure's own verified profile and
#                   the desk starts being able to say ANNOUNCED instead of
#                   only UNCORROBORATED.
#   canonical_mint  a token the figure has publicly declared theirs. Once set,
#                   any OTHER token claiming them is CONTRADICTED by their own
#                   statement rather than merely unconfirmed.
#
# Until channels are filled, every claim resolves UNCORROBORATED, and
# /status reports the registry as DEGRADED with exactly that reason. That is
# the honest state, not a broken one: name matching, serial-impersonator
# detection and contradiction all work without a single channel.

