# Watched entities for the authenticity resolver.
#
# This file is deliberately EMPTY. An entity declared here asserts that a
# specific account, domain or wallet canonically IS a named public figure or
# organisation, and that assertion is the entire basis on which the desk would
# treat a token as officially theirs rather than as a copycat. A wrong entry
# does not degrade gracefully: it makes an impersonator look verified, which
# is the single most expensive error this system can make.
#
# So nothing is seeded from memory. Every entry must be filled in from the
# entity's own published account -- a handle read off their official site, a
# wallet they have publicly acknowledged, a domain whose certificate resolves
# to them -- and recorded with where it was verified and when.
#
# Until entries exist, `AuthenticityResolver` reports DATA_BLOCKED for every
# token and the mega-event reserve stays unauthenticated. That is the correct
# reading of an empty registry: not "nothing is a copycat", but "we cannot
# tell", and the desk sizes accordingly.
#
# Schema:
#
# entities:
#   - entity_id: example-org             # stable, lowercase, never reused
#     display_name: Example Organisation
#     accounts:                          # platform -> list of stable account IDs
#       telegram: ["1234567890"]         # numeric IDs, never @display names:
#       youtube: ["UCxxxxxxxxxxxxxxxx"]  # display names are free to impersonate
#     official_domains: ["example.org"]  # registrable domains only, no paths
#     known_wallets: []                  # base58 mints/wallets they have
#                                        # publicly acknowledged
#     aliases: ["Example Org"]           # names that should trigger NAME_ONLY
#     metadata:
#       verified_from: "https://example.org/press"
#       verified_at: "2026-01-01"

entities: []
